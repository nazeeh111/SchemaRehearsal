<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1130" viewBox="0 0 420 1130" role="img" aria-labelledby="title desc"><title id="title">Parent IDs stay; child rows disappear</title><desc id="desc">A synthetic SQLite fixture has two parent IDs and three child links: child one to parent one, child two to parent one, and child three to parent two. In the retained old generated migration, foreign-key enforcement is on at DROP TABLE parents, so cascading deletes remove all child rows. The rebuilt parent IDs remain and the final integrity and foreign-key checks pass. Keepstep reports changed with exit one. The corrected generated SQL and unchanged controls retain all three children and report matched with exit zero. This applies SQL in autocommit without an outer migration-runner transaction.</desc><style>text{font-family:Arial,"DejaVu Sans",sans-serif}</style><rect width="100%" height="100%" fill="#f8f6f1"/><text x="28" y="35" font-size="13" fill="#58606a" font-weight="400">Keepstep / declared behavior on SQLite copies</text><text x="28" y="79" font-size="32" fill="#171923" font-weight="600">Parent IDs stay.</text><text x="28" y="118" font-size="32" fill="#171923" font-weight="600">Child rows disappear.</text><text x="28" y="175" font-size="16" fill="#171923" font-weight="600">Before / owned synthetic rows</text><line x1="133" y1="260" x2="88" y2="310" stroke="#938ab5" stroke-width="2"/><line x1="133" y1="260" x2="206" y2="310" stroke="#938ab5" stroke-width="2"/><line x1="305" y1="260" x2="324" y2="310" stroke="#938ab5" stroke-width="2"/><rect x="88" y="220" width="100" height="40" rx="3" fill="#eeebf7" stroke="#938ab5"/><text x="98" y="245.0" font-size="14" fill="#242430" font-weight="400">parent 1</text><rect x="260" y="220" width="100" height="40" rx="3" fill="#eeebf7" stroke="#938ab5"/><text x="270" y="245.0" font-size="14" fill="#242430" font-weight="400">parent 2</text><rect x="38" y="310" width="104" height="58" rx="3" fill="#fff" stroke="#938ab5"/><text x="48" y="344.0" font-size="14" fill="#242430" font-weight="400">child 1 → 1</text><rect x="156" y="310" width="104" height="58" rx="3" fill="#fff" stroke="#938ab5"/><text x="166" y="344.0" font-size="14" fill="#242430" font-weight="400">child 2 → 1</text><rect x="274" y="310" width="104" height="58" rx="3" fill="#fff" stroke="#938ab5"/><text x="284" y="344.0" font-size="14" fill="#242430" font-weight="400">child 3 → 2</text><text x="28" y="399" font-size="12" fill="#58606a" font-weight="400">Two parents; three exact child-parent links.</text><text x="28" y="455" font-size="17" fill="#171923" font-weight="600">At the old parent-table drop</text><rect x="28" y="475" width="330" height="43" rx="3" fill="#fff0eb" stroke="#ae3542"/><text x="38" y="501.5" font-size="14" fill="#242430" font-weight="400">foreign_keys = ON</text><rect x="28" y="537" width="330" height="43" rx="3" fill="#fff0eb" stroke="#ae3542"/><text x="38" y="563.5" font-size="14" fill="#242430" font-weight="400">DROP TABLE parents</text><text x="28" y="611" font-size="13" fill="#9b2737" font-weight="600">ON DELETE CASCADE removes 3 children.</text><text x="28" y="640" font-size="12" fill="#58606a" font-weight="400">No outer transaction in this replay.</text><text x="28" y="705" font-size="17" fill="#171923" font-weight="600">Final / integrity + FK checks pass</text><rect data-case="old" x="28" y="730" width="364" height="82" fill="#fff0eb" stroke="#b96666"/><text x="42" y="755" font-size="14" fill="#242430" font-weight="600">Old generated SQL</text><text x="42" y="781" font-size="19" fill="#9b2737" font-weight="600">Children 3 → 0</text><text x="42" y="802" font-size="13" fill="#58606a" font-weight="400">changed; CLI exit 1</text><rect data-case="fixed" x="28" y="825" width="364" height="82" fill="#edf3ec" stroke="#91a18c"/><text x="42" y="850" font-size="14" fill="#242430" font-weight="600">Corrected generated SQL</text><text x="42" y="876" font-size="19" fill="#31643b" font-weight="600">Children 3 → 3</text><text x="42" y="897" font-size="13" fill="#58606a" font-weight="400">matched; CLI exit 0</text><rect data-case="unchanged" x="28" y="920" width="364" height="82" fill="#edf3ec" stroke="#91a18c"/><text x="42" y="945" font-size="14" fill="#242430" font-weight="600">Unchanged control</text><text x="42" y="971" font-size="19" fill="#31643b" font-weight="600">Children 3 → 3</text><text x="42" y="992" font-size="13" fill="#58606a" font-weight="400">matched; CLI exit 0</text><text x="28" y="1050" font-size="12" fill="#58606a" font-weight="400">Parent IDs 2 → 2; unrelated row 1 → 1.</text><text x="28" y="1075" font-size="12" fill="#58606a" font-weight="400">Only this declared workload; changed defaults are excluded.</text><text x="28" y="1111" font-size="11" fill="#58606a" font-weight="400">Retained generated SQL, direct SQLite replay. No production safety claim.</text></svg>