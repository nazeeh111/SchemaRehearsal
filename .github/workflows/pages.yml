name: Publish recorded search reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/recorded-search/**'
      - 'docs/search-example.html'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/recorded-search/**'
      - 'docs/search-example.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorded-search-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage only the recorded public reports
        run: |
          mkdir _site
          cp docs/recorded-search/*.html docs/recorded-search/*.json _site/
          cp docs/search-example.html _site/broken.html
          touch _site/.nojekyll
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy recorded reports
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
