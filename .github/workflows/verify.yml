name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test source
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install and verify outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py
          "$RUNNER_TEMP/installed/bin/python" examples/duplicate_rows.py "$RUNNER_TEMP/receipt-demo"
