name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test source
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install and verify outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py
          "$RUNNER_TEMP/installed/bin/python" examples/duplicate_rows.py "$RUNNER_TEMP/receipt-demo"
          "$RUNNER_TEMP/installed/bin/python" examples/transactions.py "$RUNNER_TEMP/transaction-demo"
          "$RUNNER_TEMP/installed/bin/python" examples/sequence.py "$RUNNER_TEMP/sequence-demo"
          "$RUNNER_TEMP/installed/bin/python" examples/full_text_search.py "$RUNNER_TEMP/search-demo"
